<!DOCTYPE html>

<title>Diaper Stars</title>
<style>
/*
VOICE: Saturday-morning cartridge game, goofy and loud
IDEA: an 8-bit console on the living-room rug
PICTURE: the game screen itself, framed in a plastic bezel
COLOUR and TYPE: midnight navy housing, game palette inside; bitmap font drawn in canvas
LAYOUT: screen centered and as large as fits; one quiet line of controls below
*/
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0a0c24;color:#c9d0ff;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:13px/1.4 system-ui,sans-serif;
 background:radial-gradient(ellipse at 50% 40%,#1b2160 0%,#0a0c24 70%)}

canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:4px}
#hint{opacity:.75;text-align:center;padding:0 12px}
#hint b{color:#ffe14d;font-weight:600}
#touch{display:none}
body.touch #touch{display:block}
body.touch #hint{display:none}
#stick{position:fixed;left:18px;bottom:18px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.3)}
.tb{position:fixed;width:74px;height:74px;border-radius:50%;border:none;font:700 24px system-ui;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
#bA{right:18px;bottom:52px;background:#d62828}
#bB{right:104px;bottom:18px;background:#1d3fa0}

<div id="touch"><div id="stick"><div id="knob"></div></div><button class="tb" id="bB">B</button><button class="tb" id="bA">A</button></div>

{
'use strict';

ctx.imageSmoothingEnabled=false;
const W=256,H=224,CW=512,CH=448,FT=46,YD=6,GL=60,GR=660,SX=3,SY=2.7,VW=512/3,FH=405;
let camY=0;
const scrX=x=>Math.round((x-cam)*SX),scrY=y=>Math.round(40+y*SY-camY);
const UI=()=>ctx.setTransform(2,0,0,2,0,0),NATIVE=()=>ctx.setTransform(1,0,0,1,0,0);
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[(rnd()*a.length)|0],hyp=Math.hypot;
let T=0;

// ================= BITMAP FONT =================
const FONT={A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],D:[30,17,17,17,17,17,30],E:[31,16,16,30,16,16,31],F:[31,16,16,30,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],I:[14,4,4,4,4,4,14],J:[7,2,2,2,2,18,12],K:[17,18,20,24,20,18,17],L:[16,16,16,16,16,16,31],M:[17,27,21,21,17,17,17],N:[17,17,25,21,19,17,17],O:[14,17,17,17,17,17,14],P:[30,17,17,30,16,16,16],Q:[14,17,17,17,21,18,13],R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],T:[31,4,4,4,4,4,4],U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],X:[17,17,10,4,10,17,17],Y:[17,17,10,4,4,4,4],Z:[31,1,2,4,8,16,31],
'0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],'3':[31,2,4,2,1,17,14],'4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],'6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],'8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,2,12],
' ':[0,0,0,0,0,0,0],'!':[4,4,4,4,4,0,4],'?':[14,17,1,2,4,0,4],':':[0,12,12,0,12,12,0],'-':[0,0,0,14,0,0,0],'.':[0,0,0,0,0,12,12],',':[0,0,0,0,12,4,8],"'":[4,4,8,0,0,0,0],'/':[1,1,2,4,8,16,16],'+':[0,4,4,31,4,4,0],'=':[0,0,31,0,31,0,0],'&':[12,18,20,8,21,18,13],'#':[10,10,31,10,31,10,10],'<':[2,4,8,16,8,4,2],'>':[8,4,2,1,2,4,8],'(':[2,4,8,8,8,4,2],'Ű':[10,0,17,17,17,17,14],')':[8,4,2,2,2,4,8]};
const tw=(s,sc=1)=>String(s).length*6*sc-sc;
function txt(s,x,y,col,sc=1,align='left',sh=null,g=ctx){
  s=String(s).toUpperCase();
  if(align==='center')x=Math.round(x-tw(s,sc)/2);else if(align==='right')x=Math.round(x-tw(s,sc));
  if(sh)raw(s,x+(sc>2?2:1),y+(sc>2?2:1),sh,sc,g);
  raw(s,x,y,col,sc,g);
}
function raw(s,x,y,col,sc,g){
  g.fillStyle=col;
  for(let i=0;i<s.length;i++){const gl=FONT[s[i]];if(!gl)continue;
    for(let r=0;r<7;r++){const row=gl[r];if(!row)continue;for(let c=0;c<5;c++)if(row&(16>>c))g.fillRect(x+(i*6+c)*sc,y+r*sc,sc,sc);}}
}
function otxt(s,x,y,col,sc,align,oc='#000'){
  const o=sc>=3?2:1;
  for(const[dx,dy]of[[-o,0],[o,0],[0,-o],[0,o],[-o,-o],[o,o],[-o,o],[o,-o],[o,o+o]])txt(s,x+dx,y+dy,oc,sc,align);
  txt(s,x,y,col,sc,align);
}
function rgb(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function shade(h,f){return'rgb('+rgb(h).map(v=>Math.round(f>0?v+(255-v)*f:v*(1+f))).join(',')+')';}

// ================= TEAMS =================
const TEAMS=[

 {school:'EASTERN',school2:'DIAPER',mascot:'ONESIES',abbr:'EDU',trim:'#5b1f4f',num:'#ffffff',c1:'#ff5fa2',c2:'#5b1f4f',helmet:'#ffffff',stripe:'#ff5fa2',jersey:'#ff5fa2',pants:'#5b1f4f',letter:'E',icon:'onesie',logo:['#ff5fa2','#5b1f4f','#ffffff']},

 {school:'DIAPER',school2:'TECH',mascot:'SOUND MACHINES',abbr:'DT',trim:'#5fe0b0',num:'#ffffff',c1:'#9a6bff',c2:'#5fe0b0',helmet:'#5fe0b0',stripe:'#7b4bd6',jersey:'#7b4bd6',pants:'#5fe0b0',letter:'T',icon:'sound',logo:['#9a6bff','#2e1a63','#5fe0b0']},
 {school:'SOUTHERN DIAPER',school2:'UNIVERSITY',mascot:'TANTRUMS',abbr:'SDU',trim:'#151515',num:'#151515',c1:'#ffd31a',c2:'#151515',helmet:'#151515',stripe:'#ffd31a',jersey:'#ffd31a',pants:'#151515',letter:'S',icon:'tantrum',logo:['#ffd31a','#151515','#ffffff']},

 {school:'DAHN JR.',school2:'ALL STARS',mascot:'JR ALL STARS',abbr:'DJR',trim:'#1d3557',num:'#1d3557',c1:'#e63946',c2:'#1d3557',helmet:'#e63946',stripe:'#ffffff',jersey:'#f4f4f4',pants:'#1d3557',letter:'STAR',icon:'trophy',logo:['#e63946','#1d3557','#ffffff']},
 {school:'DAHN SR.',school2:'ALL STARS',mascot:'SR ALL STARS',abbr:'DSR',trim:'#c9a227',num:'#ffffff',c1:'#e0b43a',c2:'#1b5e20',helmet:'#f3e9d2',stripe:'#c9a227',jersey:'#2e7d32',pants:'#f3e9d2',letter:'STAR',icon:'trophy2',logo:['#e0b43a','#1b5e20','#f3e9d2']},
 {school:'FRIEND',school2:'ALL-STAR TEAM',mascot:'FRIEND STARS',abbr:'PALS',trim:'#0f7c74',num:'#ffffff',c1:'#ffc93c',c2:'#0f7c74',helmet:'#ffc93c',stripe:'#0f7c74',jersey:'#17b2a6',pants:'#ffffff',letter:'HEART',icon:'medal',logo:['#ffc93c','#0f7c74','#ffffff']},
 {school:'DIAPER CORP.',school2:'INCORPORATED',mascot:'TYCOONS',abbr:'CORP',trim:'#9aa0aa',num:'#ffffff',c1:'#e0567c',c2:'#4a1426',helmet:'#7a1f3d',stripe:'#c9ccd2',jersey:'#8e2447',pants:'#9aa0aa',letter:'C',icon:'briefcase',logo:['#e0567c','#4a1426','#ffffff']},
];
const fullName=t=>t.school+' '+t.school2;
// Rosters follow formation order. The QB is a two-way star and also plays linebacker.
// Offense: OL,OL,OL,QB,RB,WR,WR  Defense: DL,DL,LB,CB,CB,S,S
// the family + friends named in the game all get the light skin tone; everyone else varies
const LIGHT_NAMES=new Set(['EAMES','FOX','MOSEY','MANGO','MAINE','DALLAS','HENRY','CHARLIE','JANIE','MAGGIE','ANNIE','ARCHIE','FREDDIE','CLARK','WELLS','OTTO','MOM','DAD','BLUE','MŰTTI','GRANDPA','EVAN','BROOKE','BRIDGE','BRAD','KATIE','MATT']);
const nameSkin=n=>LIGHT_NAMES.has(n)?4:[...n].reduce((a,c)=>(a*31+c.charCodeAt(0))%9973,7)%4;
const ROSTERS=[
 {o:['TATER','PUDDIN','BEAN','MANGO','PEACH','KIWI','CLEM'],d:['CHUNK','BUTTER','MANGO','PIPER','ZIGGY','HONEY','BIRDIE']},
 {o:['GUS','BUBBA','HANK','MOSEY','OTIS','JUNO','MILO'],d:['TANK','BRUTUS','MOSEY','POPPY','REMY','IVY','NOVA']},
 {o:['HANS','AXEL','ROLF','EAMES','EERO','ARNE','RAY'],d:['BJORN','SVEN','EAMES','GRETA','FINN','INGRID','ELSA']},

 {o:['BRUNO','ROCCO','DUKE','ARCHIE','FREDDIE','JAX','REX'],d:['BUSTER','MAX','ARCHIE','ROXY','DASH','SKY','JET']},
 {o:['HUGO','BRAM','NED','CLARK','WELLS','OTTO','LEO'],d:['KNOX','GRADY','CLARK','TEDDY','BEAU','ELI','SAM']},
 {o:['DALLAS','HENRY','CHARLIE','EAMES','FOX','MOSEY','MANGO'],d:['JANIE','MAGGIE','EAMES','ANNIE','MOSEY','FOX','MANGO']},
 {o:['GRANDPA','GRANDPA','BRAD','DAD','MATT','EVAN','BROOKE'],d:['BLUE','MŰTTI','MOM','KATIE','BRIDGE','EVAN','MATT']},
 {o:['WELLS','MAINE','BUDDY','ARCHIE','FREDDIE','OTTO','CLARK'],d:['MAINE','BUDDY','ARCHIE','OTTO','CLARK','FREDDIE','WELLS']},
 {o:['COTERIE','INTERN','BOSS','HUGGIES','PAMPERS','KIRK SIG','HONEST'],d:['INTERN','BOSS','HUGGIES','HONEST','COTERIE','PAMPERS','KIRK SIG']},
];

// ================= LOGOS (pixel monograms, classic outlined style) =================
const N=32;
const R=(x0,y0,x1,y1)=>(x,y)=>x>=x0&&x<x1+1&&y>=y0&&y<y1+1;
const E=(cx,cy,rx,ry)=>(x,y)=>((x-cx)/rx)**2+((y-cy)/ry)**2<=1;
const L=(x0,y0,x1,y1,t)=>(x,y)=>{const dx=x1-x0,dy=y1-y0;let u=((x-x0)*dx+(y-y0)*dy)/(dx*dx+dy*dy);u=clamp(u,0,1);return hyp(x-x0-u*dx,y-y0-u*dy)<=t/2;};
const AND=(a,b)=>(x,y)=>a(x,y)&&b(x,y),NOT=a=>(x,y)=>!a(x,y);
const RING=(cx,cy,ro,ri)=>AND(E(cx,cy,ro,ro),NOT(E(cx,cy,ri,ri)));
const PIP=pts=>(x,y)=>{let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;};
const starPts=(cx,cy,ro,ri)=>{const a=[];for(let k=0;k<10;k++){const r=k%2?ri:ro,an=-Math.PI/2+k*Math.PI/5;a.push([cx+Math.cos(an)*r,cy+Math.sin(an)*r]);}return a;};
function paint(g,v,f){for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(f(x+.5,y+.5))g[y*N+x]=v;}
function renderMark(g,cols,o1,o2){
  const c=mkc(N,N),x=c.getContext('2d'),fl=[];
  for(let i=0;i<N*N;i++)if(g[i])fl.push(i);
  const at=(px,py)=>px<0||py<0||px>=N||py>=N?0:g[py*N+px];
  for(let py=0;py<N;py++)for(let px=0;px<N;px++){
    const v=g[py*N+px];let col=null;
    if(v){const b=cols[v];
      if(at(px-1,py-1)!==v&&at(px+1,py+1)===v)col=shade(b,.35);
      else if(at(px+1,py+1)!==v&&at(px-1,py-1)===v)col=shade(b,-.22);
      else col=b;
    }else{let m=99;for(const j of fl){const d=hyp(px-j%N,py-((j/N)|0));if(d<m)m=d;}
      if(m<=1.5)col=o1;else if(m<=2.5)col=o2;}
    if(col){x.fillStyle=col;x.fillRect(px,py,1,1);}
  }
  return c;
}
function letterMask(ch){
  const g=new Uint8Array(N*N);
  if(ch==='D'){paint(g,1,R(7,4,12,27));paint(g,1,R(5,4,14,7));paint(g,1,R(5,24,14,27));
    paint(g,1,AND(AND(E(13,16,13,12.5),NOT(E(13,16,6.5,7))),(x)=>x>=13));}
  if(ch==='E'){paint(g,1,R(7,4,13,27));paint(g,1,R(5,4,25,8));paint(g,1,R(7,14,20,17));paint(g,1,R(5,23,25,27));
    paint(g,1,R(23,4,25,11));paint(g,1,R(23,20,25,27));paint(g,1,R(19,12,20,19));}
  if(ch==='W'){paint(g,1,L(6,5,11,26,5));paint(g,1,L(11,26,16,11,3.5));paint(g,1,L(16,11,21,26,3.5));paint(g,1,L(21,26,26,5,5));
    paint(g,1,R(3,4,9,6));paint(g,1,R(23,4,29,6));}
  if(ch==='C'){paint(g,1,AND(AND(E(16,16,12,12),NOT(E(16,16,6,6.5))),(x,y)=>x<20||Math.abs(y-16)>6.5));paint(g,1,R(21,4,26,11));paint(g,1,R(21,21,26,28));}
  if(ch==='STAR')paint(g,1,PIP(starPts(16,17,13.5,5.6)));
  if(ch==='HEART'){paint(g,1,E(11,12,6.6,6.6));paint(g,1,E(21,12,6.6,6.6));paint(g,1,PIP([[4.6,14],[27.4,14],[16,28]]));}
  if(ch==='S'){paint(g,1,AND(AND(E(16,10.5,10.5,6.8),NOT(E(16,10.5,5,2.6))),(x,y)=>x<=16||y<=10.5));
    paint(g,1,AND(AND(E(16,21,10.5,6.8),NOT(E(16,21,5,2.6))),(x,y)=>x>=16||y>=21));paint(g,1,R(21,4,26,11));paint(g,1,R(6,20,11,27));}
  if(ch==='M'){paint(g,1,R(5,4,10,27));paint(g,1,R(21,4,26,27));paint(g,1,L(8,5,16,21,4.6));paint(g,1,L(23,5,16,21,4.6));
    paint(g,1,R(3,24,12,27));paint(g,1,R(19,24,28,27));paint(g,1,R(3,4,10,6));paint(g,1,R(21,4,28,6));}
  if(ch==='T'){paint(g,1,R(4,4,27,9));paint(g,1,R(13,4,18,27));paint(g,1,R(10,24,21,27));paint(g,1,R(4,4,6,13));paint(g,1,R(25,4,27,13));}
  return g;
}
function iconMask(k){
  const g=new Uint8Array(N*N);
  if(k==='pacifier'){paint(g,3,E(16,25,4,5));paint(g,2,RING(16,9,7,4));paint(g,1,E(16,18,13,7));paint(g,2,E(16,18,3.5,3.5));}

    paint(g,1,R(12,23,19,27));paint(g,2,R(10,14,21,15));paint(g,0,E(16,7,4.5,3.5));
    paint(g,2,AND(AND(E(16,7,6.5,5),NOT(E(16,7,4.5,3.5))),(x,y)=>y>=7));paint(g,3,R(13,25,13,25));paint(g,3,R(15,25,16,25));paint(g,3,R(18,25,18,25));}
  if(k==='bouncer'){paint(g,1,AND(E(16,8,11,8),(x,y)=>y>=8));paint(g,2,L(5,8,27,8,2));
    paint(g,2,L(16,15,10,18,2.5));paint(g,2,L(10,18,22,20.5,2.5));paint(g,2,L(22,20.5,10,23,2.5));paint(g,1,R(7,24,25,27));}
  if(k==='briefcase'){paint(g,2,AND(RING(16,9,6,3.5),(x,y)=>y<11));paint(g,1,R(4,11,27,27));paint(g,4,R(8,6,15,12));paint(g,4,L(8,6,13,4,2));paint(g,2,R(4,17,27,18));paint(g,3,R(14,16,17,20));}
  if(k==='trophy'||k==='trophy2'){paint(g,1,AND(E(16,8,9,10),(x,y)=>y>=6));paint(g,1,R(7,4,24,6));paint(g,1,AND(RING(7,11,4.5,2.4),(x)=>x<10));paint(g,1,AND(RING(25,11,4.5,2.4),(x)=>x>22));
    paint(g,1,R(14,17,17,22));paint(g,2,R(10,23,21,27));paint(g,3,R(11,8,12,13));}
  if(k==='medal'){paint(g,2,L(9,1,15,14,5));paint(g,3,L(23,1,17,14,5));paint(g,1,E(16,21,8.5,8.5));paint(g,4,PIP(starPts(16,21.5,5.6,2.4)));}
  if(k==='tantrum'){paint(g,1,E(16,17,11.5,10.5));paint(g,2,L(16,7.5,18,3,2.2));paint(g,2,L(8,10,13,12.5,2));paint(g,2,L(24,10,19,12.5,2));

}
function startAtBat(){

// ================= PITCH VIEW =================
const CURVEK=11,ZX0=115,ZX1=141,ZY0=150,ZY1=185;

const batFeet=()=>{const L=curBatter().bats==='L';return[(L?162:98)+pv.bx,198+pv.by,L?-1:1];};
function stealCmd(k){const r=bases[k-2];if(r&&!r.steal&&pv.phase!=='result'&&pv.phase!=='hit'){r.steal=true;r.prog=0;SFX.blip();}}
function pickoff(k){
  const r=bases[k-1];if(!r)return;SFX.throw();
  if(r.steal&&pv.phase==='ready'&&rnd()<.55){bases[k-1]=null;game.outs++;pvMsg('PICKED OFF!','#ff5a5a');SFX.bad();pv.phase='result';pv.t=0;pv.resT=1.2;pv.after=game.outs>=3?'half':'same';}

function pvMsg(text,col,t=1.1){pv.msg={text,col,t};}
function releasePitch(sel){
  const pit=curPitcher(),fr=rosters[fld()],cpuP=!humanInp(fld());

  let Tf=[.6,.76,1.0][sel+1]*(1.3-pit.vel*.045)/fat;if(cpuP)Tf/=DIFFS[diff].pit;
  const x0=128+pv.pitX-6,x1=128+pv.pitX*.35,yEnd=[163,169,176][sel+1]+(rnd()-.5)*9;
  const b={u:0,Tf,x0,x1,lat:0,latV:0,acc:0,cpuAcc:0,yEnd,sel,crossed:false};
  if(cpuP){const strike=rnd()<.62,tx=strike?117+rnd()*22:(rnd()<.5?103+rnd()*11:143+rnd()*11);
    b.cpuAcc=clamp(2*(tx-x1)/(Tf*Tf),-pit.crv*CURVEK,pit.crv*CURVEK);}

  if(!humanInp(bat()))pv.cpu={decided:false,swing:false,err:gauss()*(.025+.05*(1-DIFFS[diff].bat)),ex:gauss()*(3+8*(1-DIFFS[diff].bat)),ey:gauss()*(3.2+5*(1-DIFFS[diff].bat))};
}
function cpuBatter(dt){
  const P=pv,b=P.ball;if(!b||P.phase!=='flight'||b.crossed)return;const c=P.cpu,bt=curBatter(),L=bt.bats==='L',sg=L?-1:1;

  if(!c.decided&&b.u>.45){c.decided=true;const inZ=px>=ZX0-1&&px<=ZX1+1&&py>=ZY0-1&&py<=ZY1+1,two=game.strikes===2;
    c.swing=inZ?rnd()<(two?.95:.78):rnd()<(two?.3:.1)+.22*(1-DIFFS[diff].eye);}

}
function checkContact(){
  const P=pv,b=P.ball,bt=curBatter(),[x,y]=ballScr(b),hum=!!humanInp(bat()),[fx,fy,sg]=batFeet();
  const tolm=(hum?DIFFS[diff].help:(.7+.2*DIFFS[diff].bat))*(.85+bt.con*.03);
  if(P.bunt){const a=fx+sg*8,c=fx+sg*34,lo=Math.min(a,c),hi=Math.max(a,c),by=fy-34;
    if(x>=lo-3*tolm&&x<=hi+3*tolm&&Math.abs(y-by)<=8*tolm){
      const r=rnd();if(r<.15)return foulBack();
      return hitBall(26+rnd()*14,-8+rnd()*6,(rnd()-.5)*70,'bunt');}
    return;}
  if(P.swing<0||P.swing>.27)return;
  const hx=fx+sg*12,sweet=hx+sg*22,batY=fy-30;
  const dxe=Math.abs(x-sweet)/(14*tolm),dye=(y-batY)/(7.5*tolm),tq=1-Math.abs(P.swing-.11)/.11;
  if(dxe>1||Math.abs(dye)>1||tq<=0)return;

  const q=(1-dxe*.45)*(1-Math.abs(dye)*.5)*(.45+.55*tq);
  const launch=clamp(14-dye*38+(rnd()-.5)*10,-18,72);
  const dir=clamp(-sg*(P.swing-.11)/.09*45+(x-sweet)*sg*.6+(rnd()-.5)*34,-62,62);

function foulBack(){const P=pv;P.phase='result';P.t=0;P.resT=1;P.ball=null;noise(.08,.4,0,2500);
  if(game.strikes<2)game.strikes++;pvMsg('FOUL!','#ffffff');P.after='same';SFX.bad();}
function hitBall(v,launch,dir,kind){
  const P=pv;P.phase='hit';P.t=0;

  const L=launch*Math.PI/180,D=dir*Math.PI/180;

function judgePitch(){

  const hbp=!swung&&!P.bunt&&(L?c.x>151:c.x<105);
  P.phase='result';P.t=0;P.resT=1.05;noise(.05,.45,0,300);tone(110,.06,'square',.3);
  const stealers=bases.filter(r=>r&&r.steal);
  if(hbp){pvMsg('BONK! TAKE A BASE','#ffb347');forceAdvance();P.after='next';SFX.waah();return;}
  if(swung||inZ||(P.bunt&&inZ)){game.strikes++;tone(520,.12,'sawtooth',.14);tone(390,.25,'sawtooth',.14,.12);
    if(game.strikes>=3){game.outs++;pvMsg('STRIKE 3! OUT!','#ff5a5a');P.after=game.outs>=3?'half':stealers.length?'stealNext':'next';}
    else{pvMsg('STRIKE!','#ffe14d');P.after=stealers.length?'stealSame':'same';}}
  else{game.balls++;
    if(game.balls>=4){pvMsg('BALL 4! WALK!','#6dff6a');forceAdvance();P.after='next';}
    else{pvMsg('BALL','#6dff6a');P.after=stealers.length?'stealSame':'same';}}

function afterPitch(){

function updatePitch(dt){

  const live=P.phase==='ready'||P.phase==='windup'||P.phase==='flight';
  // ---- batter ----
  if(live){
    if(hb){
      const dk=hb.rightP?0:hb.upP?2:hb.leftP?3:hb.downP?4:0;
      if(hb.b&&dk)stealCmd(dk);
      if(!hb.b){P.bx=clamp(P.bx+hb.x*48*dt,-11,11);P.by=clamp(P.by+hb.y*38*dt,-9,9);}
      P.bunt=hb.b&&!hb.x&&!hb.y&&P.swing<0;

    }else{cpuBatter(dt);if(P.cpuSteal&&P.phase==='windup'&&bases[0]){stealCmd(2);P.cpuSteal=false;}}

      if(P.cpuWait<=0&&P.phase==='ready'){P.phase='windup';P.t=0;P.cpuSpd=pick([-1,0,0,1]);P.pitTo=(rnd()-.5)*16;}}

// ================= FIELD VIEW =================
const BASE=[[0,0],[63.6,-63.6],[0,-127.3],[-63.6,-63.6],[0,0]];
const G=32,FENCE_H=9,FRICT=30;

const SPOT={P:[0,-58],C:[0,8],'1B':[60,-82],'2B':[30,-122],SS:[-32,-120],'3B':[-60,-80],LF:[-125,-200],CF:[0,-240],RF:[125,-200]};
const FK=1.7,FKY=1.36;
const throwSpd=p=>62+p.d.arm*5;
const rpos=r=>{const a=BASE[r.lo],b=BASE[Math.min(4,r.lo+1)];return[a[0]+(b[0]-a[0])*r.s,a[1]+(b[1]-a[1])*r.s];};
function mkFielder(pos,d,side){const[sx,sy]=SPOT[pos],cpu=!humanInp(side);
  return{pos,d,x:sx,y:sy,hx:sx,hy:sy,tx:sx,ty:sy,speed:(15+d.spd*1.2)*WXB[weather].spd*(cpu?DIFFS[diff].fld:1),face:1,anim:0,jump:0,thr:0,cover:null,decideT:0,holdT:0};}
function mkRunnerF(d,lo){return{d,lo,s:0,tb:lo,speed:(16+d.spd*1.15)*WXB[weather].spd,go:0,forced:false,forceBase:0,manual:false,mustTag:false,from:lo,out:false,scored:false,anim:rnd()*4};}
function startField(kind,batterOut){

  for(let i=2;i>=0;i--){const b0=bases[i];if(!b0)continue;const r=mkRunnerF(b0.d,i+1);
    if(b0.steal){r.s=Math.min(.85,b0.prog||0);r.tb=i+2;r.stealer=true;}
    if(kind!=='steal'){const forced=i===0||(i===1&&occ[0])||(i===2&&occ[0]&&occ[1]);if(forced){r.forced=true;r.forceBase=i+2;r.tb=i+2;}}

  else{batterR=mkRunnerF(curBatter(),0);batterR.tb=1;batterR.forced=true;batterR.forceBase=1;batterR.go=-.22;batterR.isBatter=true;R.push(batterR);

    camX:0,camY:-100,react:kind==='steal'?0:.42,hitType:kind==='bunt'?'bunt':(pv.hit&&pv.hit.vz<12?'grounder':'fly')};

function stepBall(c,dt,real){

      if(-c.vz>9){c.vz=-c.vz*.38;c.vx*=.7;c.vy*=.7;}else{c.vz=0;c.state='roll';}}}
  else if(c.state==='roll'){const s=hyp(c.vx,c.vy),fr=FRICT*WXB[weather].fric*dt;if(s<=fr){c.vx=c.vy=0;}else{c.vx-=c.vx/s*fr;c.vy-=c.vy/s*fr;}c.x+=c.vx*dt;c.y+=c.vy*dt;}

function predict(b,hor){const c={state:b.state,x:b.x,y:b.y,z:b.z,vx:b.vx,vy:b.vy,vz:b.vz,landed:true},out=[];
  for(let t=0;t<=hor;t+=.05){out.push({t,x:c.x,y:c.y,z:c.z});stepBall(c,.05,false);if(c.state==='gone')break;}return out;}
const isFair=(x,y)=>y<=0&&Math.abs(Math.atan2(x,-y))<=Math.PI/4+.01;

function decideFair(touch){

function foulBall(){const f=fv;if(f.done)return;f.msg={text:'FOUL BALL',col:'#ffffff',t:1};f.done=true;f.doneT=1.1;f.foul=true;SFX.bad();}

function coverTargets(){

function shouldGo(r){

const baseFree=(k,r)=>!fv.R.some(o=>o!==r&&!o.out&&!o.scored&&o.lo===k&&o.s===0);

function runnerCmd(hb){

function updateField(dt){

  }else{ctx.fillStyle='#10163a';ctx.fillRect(x,y,w,h);otxt('?',x+w/2,y+40,'#ffe14d',5,'center');txt('A RANDOM BALLPARK',x+w/2,y+h+8,'#ffffff',1,'center');}
  txt('A = PICK   B = BACK',128,212,'#9fd0ff',1,'center');
}

function drawPitchViewSafe(){try{if(pv)drawPitchView();}catch(e){ctx.fillStyle='#0d1236';ctx.fillRect(0,0,W,H);}}
function drawGameover(){
  ctx.fillStyle='#0d1236';ctx.fillRect(0,0,W,H);

function render(){
  ctx.imageSmoothingEnabled=false;UI();
  if(scene){drawSceneBB();}
  else if(state==='title')drawTitle();
  else if(state==='teams')drawTeams();
  else if(state==='howto')drawHowto();
  else if(state==='select')drawSelect();
  else if(state==='stadium')drawStadium();
  else if(state==='gameover')drawGameover();
  else if(state==='banner')drawBanner();
  else if(state==='pitch')drawPitchView();
  else if(state==='field')drawFieldView();
  UI();
  if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);otxt('PAUSED',128,100,'#ffe14d',2,'center');txt('PRESS P TO RESUME',128,124,'#ffffff',1,'center');}
  if(muted)txt('MUTE',252,216,'#ff6b6b',1,'right');
}

// ================= LOOP + LAYOUT =================
function fit(){
  const touchPad=document.body.classList.contains('touch')?0:40;
  const aw=innerWidth-28,ah=innerHeight-touchPad-28;
  let s=Math.min(aw/CW,ah/CH);if(s>=1)s=Math.floor(s*4)/4;s=Math.max(.5,s);
  cv.style.width=Math.round(CW*s)+'px';cv.style.height=Math.round(CH*s)+'px';
}
addEventListener('resize',fit);
// touch
if(matchMedia('(pointer: coarse)').matches){
  document.body.classList.add('touch');touch.active=true;
  const st=document.getElementById('stick'),kn=document.getElementById('knob');
  const mv=e=>{const r=st.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    touch.x=dx>18?1:dx<-18?-1:0;touch.y=dy>18?1:dy<-18?-1:0;const l=Math.min(40,hyp(dx,dy)),a=Math.atan2(dy,dx);
    kn.style.transform='translate('+Math.cos(a)*l+'px,'+Math.sin(a)*l+'px)';};
  st.addEventListener('pointerdown',e=>{initAudio();st.setPointerCapture(e.pointerId);mv(e);});
  st.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')mv(e);});
  const up=()=>{touch.x=touch.y=0;kn.style.transform='';};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  for(const[id,k]of[['bA','a'],['bB','b']]){const b=document.getElementById(id);
    b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();touch[k]=true;});
    for(const ev of['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{touch[k]=false;});}
}
fit();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  pollInput();if(!paused)update(dt);render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
